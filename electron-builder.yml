appId: com.multiomon.desktop
productName: MultiOmon
asar: true
directories:
  output: dist
files:
  - out/**/*
  - package.json
mac:
  category: public.app-category.social-networking
  target:
    - dmg
    - zip
win:
  target:
    - nsis
linux:
  category: Network
  target:
    - AppImage
    - deb
artifactName: ${productName}-${version}-${os}-${arch}.${ext}
